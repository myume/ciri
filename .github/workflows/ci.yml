name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31

    - name: Build
      run: cargo build --release --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Resolve niri version from nixpkgs
      id: niri
      run: |
        VERSION=$(nix eval --raw --inputs-from . nixpkgs#niri.version)
        TAG="v$VERSION"
        git ls-remote --exit-code --tags https://github.com/niri-wm/niri.git "refs/tags/$TAG" \
          || { echo "tag $TAG not found"; exit 1; }
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
    - name: Check niri types
      run: | 
        cargo run -- --clean --branch "$NIRI_TAG"
        if ! git diff --exit-code --quiet; then
          echo "inconsistencies in generated files have been detected"
          exit 1
        fi
      env:
        NIRI_TAG: ${{ steps.niri.outputs.tag }}

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt clippy
    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: Run rustfmt
      run: cargo fmt --all --check

  nix-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - run: nix flake check
